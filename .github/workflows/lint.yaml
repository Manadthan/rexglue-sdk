name: Lint & Format Check

on: [pull_request, push]

jobs:
  format-check:
    name: Format Check
    # Pinned: apt.llvm.org has no clang-format 20 repository for the newer
    # ubuntu-latest image (26.04), so llvm.sh 20 fails there with a 404.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-format-20

      # - name: Install cmake-format
        # run: pip install cmake-format

      - name: Check C/C++ formatting
        run: |
          find include src tests \
            -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.c' \) \
            | xargs clang-format-20 --dry-run --Werror

